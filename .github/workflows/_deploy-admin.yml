name: Deploy Admin

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: admin-assets-${{ inputs.sha }}
          path: apps/admin/dist/client
      - name: Resolve Cloudflare credentials
        run: |-
          sops -d "secrets/secrets.${{ inputs.environment }}.age.env" > "$RUNNER_TEMP/environment.env"
          secret() { sed -n "s/^$1=//p" "$RUNNER_TEMP/environment.env" | head -n 1; }
          CLOUDFLARE_API_TOKEN="$(secret CLOUDFLARE_API_TOKEN)"
          CLOUDFLARE_ACCOUNT_ID="$(secret CLOUDFLARE_ACCOUNT_ID)"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/environment.env"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Upload Admin secrets
        run: |-
          sops -d "secrets/secrets.${{ inputs.environment }}.age.env" > "$RUNNER_TEMP/environment.env"
          secret() { sed -n "s/^$1=//p" "$RUNNER_TEMP/environment.env" | head -n 1; }
          require() { test -n "$(secret "$1")" || { echo "missing required secret: $1" >&2; exit 1; }; }
          require ADMIN_SESSION_SECRET
          require GITHUB_OAUTH_CLIENT_ID
          require GITHUB_OAUTH_CLIENT_SECRET
          if [ -n "$(secret GOOGLE_OAUTH_CLIENT_ID)" ] || [ -n "$(secret GOOGLE_OAUTH_CLIENT_SECRET)" ]; then
            require GOOGLE_OAUTH_CLIENT_ID
            require GOOGLE_OAUTH_CLIENT_SECRET
          fi
          put() {
            local name="$1" value
            value="$(secret "$name")"
            echo "::add-mask::$value"
            printf '%s' "$value" | pnpm --filter @ten/admin exec wrangler secret put "$name" --env "${{ inputs.environment }}"
          }
          put ADMIN_SESSION_SECRET
          if [ -n "$(secret GOOGLE_OAUTH_CLIENT_ID)" ] || [ -n "$(secret GOOGLE_OAUTH_CLIENT_SECRET)" ]; then
            put GOOGLE_OAUTH_CLIENT_ID
            put GOOGLE_OAUTH_CLIENT_SECRET
          fi
          put GITHUB_OAUTH_CLIENT_ID
          put GITHUB_OAUTH_CLIENT_SECRET
          rm -f "$RUNNER_TEMP/environment.env"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Deploy Admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy --env "${{ inputs.environment }}" --var "DEPLOY_VERSION:${{ inputs.sha }}"
      - name: Check Admin
        run: |-
          case "$TEN_ADMIN_URL" in
            https://*.workers.dev) : ;;
            *) echo "TEN_ADMIN_URL must be an https workers.dev URL" >&2; exit 1 ;;
          esac
          health="$(curl --fail --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$TEN_ADMIN_URL/api/health")"
          actual="$(printf '%s' "$health" | jq -r '.version // empty')"
          test "$actual" = "${{ inputs.sha }}" || { echo "health version mismatch: $actual != ${{ inputs.sha }}" >&2; exit 1; }
        env:
          TEN_ADMIN_URL: ${{ vars.TEN_ADMIN_URL }}
