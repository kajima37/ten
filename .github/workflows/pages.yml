name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build SPA for GitHub Pages
        run: pnpm build:pages
        env:
          VITE_API_URL: ${{ vars.TEN_API_URL }}
      - name: Verify API URL
        run: >-
          test -n "$VITE_API_URL" &&
          printf '%s' "$VITE_API_URL" | grep -Eq '^https://[^/]+$'
        env:
          VITE_API_URL: ${{ vars.TEN_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
