name: Deploy Production Worker

on:
  push:
    branches: [production]
    paths:
      - 'apps/worker/**'
      - 'packages/game-core/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    environment: production-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Validate source and tests
        run: pnpm check
      - name: Verify production ref
        run: test "$GITHUB_REF" = "refs/heads/production"
      - name: Decrypt production secrets
        run: |-
          sops -d secrets/secrets.production.age.env > "$RUNNER_TEMP/production.env"
          sed -E '/^[[:space:]]*(#|$)/d' "$RUNNER_TEMP/production.env" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Upload production Worker secrets
        run: |-
          test -n "$AUTH_SECRET"
          test -n "$ADMIN_SECRET"
          printf '%s' "$AUTH_SECRET" | pnpm --filter @ten/worker exec wrangler secret put AUTH_SECRET --env production
          printf '%s' "$ADMIN_SECRET" | pnpm --filter @ten/worker exec wrangler secret put ADMIN_SECRET --env production
      - name: Apply production D1 migrations
        working-directory: apps/worker
        run: pnpm db:migrate:production
      - name: Deploy production Worker
        working-directory: apps/worker
        run: pnpm deploy:production
      - name: Check production Worker
        run: curl --fail --retry 5 --retry-delay 2 "$TEN_API_URL/api/health"
        env:
          TEN_API_URL: ${{ vars.TEN_API_URL }}
