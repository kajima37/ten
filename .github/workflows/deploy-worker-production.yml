name: Deploy Production Worker

on:
  push:
    branches: [production]
    paths:
      - 'apps/worker/**'
      - 'packages/game-core/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    environment: production-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify production ref
        run: test "$GITHUB_REF" = "refs/heads/production"
      - name: Apply production D1 migrations
        working-directory: apps/worker
        run: pnpm db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy production Worker
        working-directory: apps/worker
        run: pnpm deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check production Worker
        run: curl --fail --retry 5 --retry-delay 2 "$TEN_API_URL/api/health"
        env:
          TEN_API_URL: ${{ vars.TEN_API_URL }}
