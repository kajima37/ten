name: Deploy Staging Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/web/**'
      - 'packages/game-core/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: worker-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Validate source and tests
        run: pnpm check
      - name: Build staging web preview
        run: pnpm build:worker
      - name: Decrypt staging secrets
        run: |-
          sops -d secrets/secrets.staging.age.env > "$RUNNER_TEMP/staging.env"
          sed -E '/^[[:space:]]*(#|$)/d' "$RUNNER_TEMP/staging.env" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Upload staging Worker secrets
        run: |-
          test -n "$AUTH_SECRET"
          test -n "$ADMIN_SECRET"
          printf '%s' "$AUTH_SECRET" | pnpm --filter @ten/worker exec wrangler secret put AUTH_SECRET --env staging
          printf '%s' "$ADMIN_SECRET" | pnpm --filter @ten/worker exec wrangler secret put ADMIN_SECRET --env staging
      - name: Apply staging D1 migrations
        working-directory: apps/worker
        run: pnpm db:migrate:staging
      - name: Deploy staging Worker
        working-directory: apps/worker
        run: pnpm deploy:staging
      - name: Check staging Worker
        run: |-
          test -n "$ACCESS_CLIENT_ID"
          test -n "$ACCESS_CLIENT_SECRET"
          curl --fail --retry 5 --retry-delay 2 \
            -H "CF-Access-Client-Id: $ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $ACCESS_CLIENT_SECRET" \
            "$TEN_API_URL/api/health"
        env:
          TEN_API_URL: ${{ vars.TEN_API_URL }}
