name: Deploy Staging Worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/game-core/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: worker-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Decrypt staging secrets
        run: |-
          sops -d secrets/secrets.staging.age.env > "$RUNNER_TEMP/staging.env"
          sed -E '/^[[:space:]]*(#|$)/d' "$RUNNER_TEMP/staging.env" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Apply staging D1 migrations
        working-directory: apps/worker
        run: pnpm db:migrate:staging
      - name: Deploy staging Worker
        working-directory: apps/worker
        run: pnpm deploy:staging
      - name: Check staging Worker
        run: curl --fail --retry 5 --retry-delay 2 "$TEN_API_URL/api/health"
        env:
          TEN_API_URL: ${{ vars.TEN_API_URL }}
