name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify tag and production ancestry
        run: >-
          test "$GITHUB_REF_TYPE" = "tag" &&
          printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' &&
          git fetch --quiet origin production &&
          git merge-base --is-ancestor "$GITHUB_SHA" origin/production
      - name: Wait for production pipeline
        run: |-
          deadline=$((SECONDS + 3600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest" --jq '[.check_runs[] | select(.name == "Production ready")] | last | .conclusion // empty')"
            case "$conclusion" in
              success) exit 0 ;;
              '') sleep 30 ;;
              *) echo "Production ready concluded: $conclusion" >&2; exit 1 ;;
            esac
          done
          echo 'timed out waiting for Production ready' >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
  release:
    needs: verify-production
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: true
      - name: Install Android SDK packages
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-36"
          "build-tools;35.0.0"
          "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Derive version
        id: version
        run: |-
          name="${GITHUB_REF_NAME#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "TEN_VERSION_NAME=$name"
            echo "TEN_VERSION_CODE=${{ github.run_number }}"
          } >> "$GITHUB_ENV"
      - name: Verify API URL
        run: >-
          test -n "$VITE_API_URL" &&
          printf '%s' "$VITE_API_URL" | grep -Eq '^https://[^/]+$'
        env:
          VITE_API_URL: ${{ vars.TEN_API_URL }}
      - name: Verify AdMob App ID
        run: test -n "$ADMOB_APP_ID"
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      - name: Build release AAB
        run: sops exec-env secrets/secrets.android-release.age.env -- bash scripts/ci/android-release.sh
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          VITE_API_URL: ${{ vars.TEN_API_URL }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      - name: Verify signed AAB
        working-directory: apps/web/android
        run: |-
          test -f app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJson: ${{ runner.temp }}/service-account.json
          packageName: net.sajima.ten
          releaseFiles: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          releaseName: ${{ steps.version.outputs.name }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ten-android-release-${{ github.ref_name }}
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
      - name: Remove release files
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/service-account.json"
