name: iOS Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    environment: release
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify tag
        run: >-
          test "$GITHUB_REF_TYPE" = "tag" &&
          printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - name: Verify tag is on production
        run: >-
          git fetch --quiet origin production &&
          git merge-base --is-ancestor "$GITHUB_SHA" origin/production
      - name: Decrypt release secrets
        run: |-
          sops -d secrets/secrets.ios-release.age.env > "$RUNNER_TEMP/ios-release.env"
          sed -E '/^[[:space:]]*(#|$)/d' "$RUNNER_TEMP/ios-release.env" >> "$GITHUB_ENV"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Derive version
        id: version
        run: |-
          name="${GITHUB_REF_NAME#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "TEN_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "TEN_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Export release secrets
        id: secrets
        run: |-
          echo "certb64=$APPLE_CERTIFICATE_BASE64" >> "$GITHUB_OUTPUT"
          echo "certpass=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "team=$APPLE_TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "keyid=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_OUTPUT"
          echo "issuer=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_OUTPUT"
          {
            echo "apikey<<EOF"
            printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Verify API URL
        run: >-
          test -n "$VITE_API_URL" &&
          printf '%s' "$VITE_API_URL" | grep -Eq '^https://[^/]+$'
        env:
          VITE_API_URL: ${{ vars.TEN_API_URL }}
      - run: pnpm mobile:sync
        env:
          VITE_API_URL: ${{ vars.TEN_API_URL }}
      - name: Write App Store Connect API key
        run: |-
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
      - name: Import codesigning certificates
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ steps.secrets.outputs.certb64 }}
          p12-password: ${{ steps.secrets.outputs.certpass }}
      - name: Download provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.ten.game
          profile-type: IOS_APP_STORE
          issuer-id: ${{ steps.secrets.outputs.issuer }}
          api-key-id: ${{ steps.secrets.outputs.keyid }}
          api-private-key: ${{ steps.secrets.outputs.apikey }}
      - name: Archive app
        run: >-
          xcodebuild archive
          -project apps/web/ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -archivePath "$RUNNER_TEMP/App.xcarchive"
          -destination 'generic/platform=iOS'
          -allowProvisioningUpdates
          -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"
          -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGN_STYLE=Automatic
          MARKETING_VERSION="$TEN_VERSION_NAME"
          CURRENT_PROJECT_VERSION="$TEN_BUILD_NUMBER"
      - name: Write export options
        run: |-
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          PLIST
      - name: Export IPA
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/App.xcarchive"
          -exportPath "$RUNNER_TEMP/ipa"
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/ipa/App.ipa
          issuer-id: ${{ steps.secrets.outputs.issuer }}
          api-key-id: ${{ steps.secrets.outputs.keyid }}
          api-private-key: ${{ steps.secrets.outputs.apikey }}
          wait-for-processing: 'true'
      - uses: actions/upload-artifact@v6
        with:
          name: ten-ios-release-${{ github.ref_name }}
          path: ${{ runner.temp }}/ipa/App.ipa
          if-no-files-found: error
          retention-days: 90
