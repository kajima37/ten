name: Deploy Worker

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      sha:
        required: true
        type: string
      download-assets:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Download staging web assets
        if: inputs.download-assets
        uses: actions/download-artifact@v7
        with:
          name: staging-worker-assets-${{ inputs.sha }}
          path: apps/web/dist/client
      - name: Resolve Cloudflare credentials
        run: |-
          sops -d "secrets/secrets.${{ inputs.environment }}.age.env" > "$RUNNER_TEMP/environment.env"
          secret() { sed -n "s/^$1=//p" "$RUNNER_TEMP/environment.env" | head -n 1; }
          CLOUDFLARE_API_TOKEN="$(secret CLOUDFLARE_API_TOKEN)"
          CLOUDFLARE_ACCOUNT_ID="$(secret CLOUDFLARE_ACCOUNT_ID)"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/environment.env"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Upload staging Worker secrets
        if: inputs.environment == 'staging'
        run: |-
          sops -d secrets/secrets.staging.age.env > "$RUNNER_TEMP/staging.env"
          secret() { sed -n "s/^$1=//p" "$RUNNER_TEMP/staging.env" | head -n 1; }
          require() { test -n "$(secret "$1")" || { echo "missing required secret: $1" >&2; exit 1; }; }
          require AUTH_SECRET
          require PREVIEW_SESSION_SECRET
          require GITHUB_OAUTH_CLIENT_ID
          require GITHUB_OAUTH_CLIENT_SECRET
          if [ -n "$(secret GOOGLE_OAUTH_CLIENT_ID)" ] || [ -n "$(secret GOOGLE_OAUTH_CLIENT_SECRET)" ]; then
            require GOOGLE_OAUTH_CLIENT_ID
            require GOOGLE_OAUTH_CLIENT_SECRET
          fi
          put() {
            local name="$1" value
            value="$(secret "$name")"
            echo "::add-mask::$value"
            printf '%s' "$value" | pnpm --filter @ten/worker exec wrangler secret put "$name" --env staging
          }
          put AUTH_SECRET
          put PREVIEW_SESSION_SECRET
          if [ -n "$(secret GOOGLE_OAUTH_CLIENT_ID)" ] || [ -n "$(secret GOOGLE_OAUTH_CLIENT_SECRET)" ]; then
            put GOOGLE_OAUTH_CLIENT_ID
            put GOOGLE_OAUTH_CLIENT_SECRET
          fi
          put GITHUB_OAUTH_CLIENT_ID
          put GITHUB_OAUTH_CLIENT_SECRET
          rm -f "$RUNNER_TEMP/staging.env"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Upload production Worker secrets
        if: inputs.environment == 'production'
        run: |-
          sops -d secrets/secrets.production.age.env > "$RUNNER_TEMP/production.env"
          secret() { sed -n "s/^$1=//p" "$RUNNER_TEMP/production.env" | head -n 1; }
          AUTH_SECRET="$(secret AUTH_SECRET)"
          test -n "$AUTH_SECRET"
          echo "::add-mask::$AUTH_SECRET"
          printf '%s' "$AUTH_SECRET" | pnpm --filter @ten/worker exec wrangler secret put AUTH_SECRET --env production
          rm -f "$RUNNER_TEMP/production.env"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Deploy Worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --env "${{ inputs.environment }}" --var "DEPLOY_VERSION:${{ inputs.sha }}"
      - name: Check Worker
        run: |-
          case "$TEN_API_URL" in
            https://*.workers.dev) : ;;
            *) echo "TEN_API_URL must be an https workers.dev URL" >&2; exit 1 ;;
          esac
          health="$(curl --fail --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$TEN_API_URL/api/health")"
          actual="$(printf '%s' "$health" | jq -r '.version // empty')"
          test "$actual" = "${{ inputs.sha }}" || { echo "health version mismatch: $actual != ${{ inputs.sha }}" >&2; exit 1; }
        env:
          TEN_API_URL: ${{ vars.TEN_API_URL }}
