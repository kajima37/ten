name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:mobile
      - name: Verify Capacitor web bundle
        run: test -f apps/web/dist/client/index.html
      - name: Install Chromium for browser tests
        run: pnpm --filter @ten/web exec playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: pnpm test:e2e
