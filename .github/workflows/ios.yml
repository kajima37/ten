name: iOS

on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    environment: staging
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify API URL
        run: >-
          test -n "$VITE_API_URL" &&
          printf '%s' "$VITE_API_URL" | grep -Eq '^https://[^/]+$'
        env:
          VITE_API_URL: ${{ vars.TEN_API_URL }}
      - run: pnpm mobile:sync
        env:
          VITE_API_URL: ${{ vars.TEN_API_URL }}
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project apps/web/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath apps/web/ios/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: actions/upload-artifact@v6
        with:
          name: ten-ios-simulator-${{ github.sha }}
          path: apps/web/ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
