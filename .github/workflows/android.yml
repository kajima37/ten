name: Android

on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Install Android SDK packages
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-36"
          "build-tools;35.0.0"
          "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Verify API URL
        run: >-
          test -n "$VITE_API_URL" &&
          printf '%s' "$VITE_API_URL" | grep -Eq '^https://[^/]+$'
        env:
          VITE_API_URL: ${{ vars.TEN_API_URL }}
      - run: pnpm mobile:sync
        env:
          VITE_API_URL: ${{ vars.TEN_API_URL }}
      - name: Make Gradle wrapper executable
        run: chmod +x apps/web/android/gradlew
      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: ten-android-debug-${{ github.sha }}
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
