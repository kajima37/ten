name: Pipeline

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      worker-staging: ${{ steps.outputs.outputs.worker-staging }}
      worker-production: ${{ steps.outputs.outputs.worker-production }}
      admin: ${{ steps.outputs.outputs.admin }}
      web: ${{ steps.outputs.outputs.web }}
      mobile: ${{ steps.outputs.outputs.mobile }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            worker-staging:
              - 'apps/worker/**'
              - 'apps/web/**'
              - 'packages/game-core/**'
              - 'packages/oauth/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'mise.toml'
              - 'eslint.config.js'
              - 'prettier.config.js'
              - 'tsconfig*.json'
            worker-production:
              - 'apps/worker/**'
              - 'packages/game-core/**'
              - 'packages/oauth/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'mise.toml'
              - 'eslint.config.js'
              - 'prettier.config.js'
              - 'tsconfig*.json'
            admin:
              - 'apps/admin/**'
              - 'apps/worker/migrations/**'
              - 'packages/oauth/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'mise.toml'
              - 'eslint.config.js'
              - 'prettier.config.js'
              - 'tsconfig*.json'
            web:
              - 'apps/web/**'
              - 'packages/game-core/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'mise.toml'
              - 'eslint.config.js'
              - 'prettier.config.js'
              - 'tsconfig*.json'
            mobile:
              - 'apps/web/**'
              - 'packages/game-core/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'mise.toml'
              - 'eslint.config.js'
              - 'prettier.config.js'
              - 'tsconfig*.json'
      - id: outputs
        run: |-
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            {
              for target in worker-staging worker-production admin web mobile; do
                echo "$target=true"
              done
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "worker-staging=${{ steps.filter.outputs.worker-staging }}"
              echo "worker-production=${{ steps.filter.outputs.worker-production }}"
              echo "admin=${{ steps.filter.outputs.admin }}"
              echo "web=${{ steps.filter.outputs.web }}"
              echo "mobile=${{ steps.filter.outputs.mobile }}"
            } >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build-web:
    needs: [changes, validate]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  build-mobile:
    needs: [changes, validate]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mobile
      - name: Verify Capacitor web bundle
        run: test -f apps/web/dist/client/index.html

  build-staging-worker-assets:
    needs: [changes, validate]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.worker-staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:worker
      - uses: actions/upload-artifact@v6
        with:
          name: staging-worker-assets-${{ github.sha }}
          path: apps/web/dist/client
          if-no-files-found: error
          retention-days: 1

  build-admin-assets:
    needs: [changes, validate]
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ten/admin build
      - uses: actions/upload-artifact@v6
        with:
          name: admin-assets-${{ github.sha }}
          path: apps/admin/dist/client
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify runner Chrome
        run: google-chrome --version
      - name: Run browser smoke tests
        run: pnpm test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  migrate-staging:
    needs: [changes, validate]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.worker-staging == 'true' || needs.changes.outputs.admin == 'true')
    environment: staging
    concurrency:
      group: d1-staging-migrations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Apply staging D1 migrations
        working-directory: apps/worker
        run: sops exec-env "${{ github.workspace }}/secrets/secrets.staging.age.env" 'pnpm db:migrate:staging'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  migrate-production:
    needs: [changes, validate, e2e]
    if: github.ref == 'refs/heads/production' && (needs.changes.outputs.worker-production == 'true' || needs.changes.outputs.admin == 'true')
    environment: production
    concurrency:
      group: d1-production-migrations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Apply production D1 migrations
        working-directory: apps/worker
        run: sops exec-env "${{ github.workspace }}/secrets/secrets.production.age.env" 'pnpm db:migrate:production'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  deploy-production-worker:
    needs: [changes, validate, e2e, migrate-production]
    if: always() && github.ref == 'refs/heads/production' && needs.changes.outputs.worker-production == 'true' && needs.validate.result == 'success' && needs.e2e.result == 'success' && needs.migrate-production.result == 'success'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ENV: production
    steps: &worker-deploy-steps
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Download staging web assets
        if: env.DEPLOY_ENV == 'staging'
        uses: actions/download-artifact@v7
        with:
          name: staging-worker-assets-${{ github.sha }}
          path: apps/web/dist/client
      - name: Upload staging Worker secrets
        if: env.DEPLOY_ENV == 'staging'
        run: sops exec-env secrets/secrets.staging.age.env 'bash scripts/ci/upload-worker-secrets.sh staging'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Upload production Worker secrets
        if: env.DEPLOY_ENV == 'production'
        run: sops exec-env secrets/secrets.production.age.env 'bash scripts/ci/upload-worker-secrets.sh production'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Deploy Worker
        working-directory: apps/worker
        run: sops exec-env "${{ github.workspace }}/secrets/secrets.$DEPLOY_ENV.age.env" 'pnpm exec wrangler deploy --env "$DEPLOY_ENV" --var "DEPLOY_VERSION:$GITHUB_SHA"'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Check Worker
        run: |-
          case "$TEN_API_URL" in
            https://ten-api-"$DEPLOY_ENV".*.workers.dev) : ;;
            *) echo "TEN_API_URL must target ten-api-$DEPLOY_ENV on workers.dev" >&2; exit 1 ;;
          esac
          deadline=$((SECONDS + 120))
          actual=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            if health="$(curl --fail --proto '=https' --tlsv1.2 "$TEN_API_URL/api/health")"; then
              actual="$(printf '%s' "$health" | jq -r '.version // empty')"
              [ "$actual" = "$GITHUB_SHA" ] && exit 0
            fi
            sleep 2
          done
          echo "health version mismatch: $actual != $GITHUB_SHA" >&2
          exit 1
        env:
          TEN_API_URL: ${{ vars.TEN_API_URL }}

  deploy-staging-worker:
    needs: [changes, validate, build-staging-worker-assets, migrate-staging]
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.worker-staging == 'true' && needs.validate.result == 'success' && needs.build-staging-worker-assets.result == 'success' && needs.migrate-staging.result == 'success'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ENV: staging
    steps: *worker-deploy-steps

  deploy-production-admin:
    needs: [changes, validate, e2e, build-admin-assets, migrate-production]
    if: always() && github.ref == 'refs/heads/production' && needs.changes.outputs.admin == 'true' && needs.validate.result == 'success' && needs.e2e.result == 'success' && needs.build-admin-assets.result == 'success' && needs.migrate-production.result == 'success'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ENV: production
    steps: &admin-deploy-steps
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: admin-assets-${{ github.sha }}
          path: apps/admin/dist/client
      - name: Upload Admin secrets
        run: sops exec-env "secrets/secrets.$DEPLOY_ENV.age.env" "bash scripts/ci/upload-admin-secrets.sh \"$DEPLOY_ENV\""
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Deploy Admin
        working-directory: apps/admin
        run: sops exec-env "${{ github.workspace }}/secrets/secrets.$DEPLOY_ENV.age.env" 'pnpm exec wrangler deploy --env "$DEPLOY_ENV" --var "DEPLOY_VERSION:$GITHUB_SHA"'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      - name: Check Admin
        run: |-
          case "$TEN_ADMIN_URL" in
            https://ten-admin-"$DEPLOY_ENV".*.workers.dev) : ;;
            *) echo "TEN_ADMIN_URL must target ten-admin-$DEPLOY_ENV on workers.dev" >&2; exit 1 ;;
          esac
          deadline=$((SECONDS + 120))
          actual=''
          while [ "$SECONDS" -lt "$deadline" ]; do
            if health="$(curl --fail --proto '=https' --tlsv1.2 "$TEN_ADMIN_URL/api/health")"; then
              actual="$(printf '%s' "$health" | jq -r '.version // empty')"
              [ "$actual" = "$GITHUB_SHA" ] && exit 0
            fi
            sleep 2
          done
          echo "health version mismatch: $actual != $GITHUB_SHA" >&2
          exit 1
        env:
          TEN_ADMIN_URL: ${{ vars.TEN_ADMIN_URL }}

  deploy-staging-admin:
    needs: [changes, validate, build-admin-assets, migrate-staging]
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.admin == 'true' && needs.validate.result == 'success' && needs.build-admin-assets.result == 'success' && needs.migrate-staging.result == 'success'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ENV: staging
    steps: *admin-deploy-steps

  production-ready:
    name: Production ready
    needs:
      [
        changes,
        validate,
        e2e,
        deploy-production-worker,
        deploy-production-admin,
      ]
    if: always() && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Verify production pipeline
        run: |-
          test "$VALIDATE" = success
          test "$E2E" = success
          if [ "$WORKER_CHANGED" = true ]; then test "$WORKER_DEPLOY" = success; fi
          if [ "$ADMIN_CHANGED" = true ]; then test "$ADMIN_DEPLOY" = success; fi
        env:
          VALIDATE: ${{ needs.validate.result }}
          E2E: ${{ needs.e2e.result }}
          WORKER_CHANGED: ${{ needs.changes.outputs.worker-production }}
          ADMIN_CHANGED: ${{ needs.changes.outputs.admin }}
          WORKER_DEPLOY: ${{ needs.deploy-production-worker.result }}
          ADMIN_DEPLOY: ${{ needs.deploy-production-admin.result }}
