# 秘密情報の暗号化ルール
#
# - staging 用ファイルは staging 鍵のみで復号できます
# - production / android-release / ios-release は本番系鍵のみで復号できます
# - 秘密鍵 (.private/) はリポジトリへコミットせず、個人の秘密情報マネージャーで管理します
#
# 鍵のローテーション方法は docs/deployment/secrets.md を参照してください。

creation_rules:
  - path_regex: secrets\.staging\.age\.env$
    age: age1zzkrk3dhmm3m6ygpvmv68dvn09jutlzdpp86v40zdepyuvqz2dqs0rr4h8
  - path_regex: secrets\.(production|android-release|ios-release)\.age\.env$
    age: age1py7r6pap6vne3u4unj267ltlqz6atgwrr6rnm5n0hde6u7c8xe6qesd0g8
